services:
  postgres:
    image: postgres:18
    container_name: gestion-vehiculos-db
    environment:
      POSTGRES_DB: gestion_vehiculos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql

  tomcat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gestion-vehiculos-tomcat
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: gestion_vehiculos
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      - postgres

volumes:
  postgres_data: